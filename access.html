<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Access Request</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 25px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-line;
    }

    .waiting {
      color: #b7791f;
    }

    .rejected {
      color: #d93025;
    }

    .approved {
      color: #188038;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="title">Access Request</h1>

    <p id="description">
      Create 6-digit ID to request access
    </p>

    <input
      id="deviceId"
      type="text"
      maxlength="6"
      autocomplete="off"
      placeholder="PULSE1"
    >

    <button id="submitBtn">Request</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const FUNCTION_URL =
      "https://yusznijfwkdcvrrqqapz.supabase.co/functions/v1/telegram-access";

    const STORAGE_KEY = "pulseAutoImportDeviceId";
    const LANGUAGE_KEY = "pulseAutoImportLanguage";

    const deviceInput = document.getElementById("deviceId");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const description = document.getElementById("description");
    const title = document.getElementById("title");

    let statusTimer = null;
    let currentDeviceId = null;
    let redirectTimer = null;
    let redirecting = false;

    const translations = {
      en: {
        title: "Access Request",
        description: "Create 6-digit ID to request access",
        request: "Request",
        newRequest: "New Request",
        accessGranted: "Access granted ✅",
        accessDenied: "Access denied ❌",
        idBlocked: "Your ID blocked",
        idExists: "This ID already exists",
        pending: "Your access request is pending.",
        invalidId: "Enter a valid 6-digit ID\nUse only A-Z and 0-9",
        sending: "Sending request..",
        verificationError: "An error occurred during verification.",
        generalError: "An error occurred. Please try again."
      },

      hy: {
        title: "Մուտքի հարցում",
        description: "Մուտքի հարցում ուղարկելու համար ստեղծեք 6-անիշ ID",
        request: "Հարցում",
        newRequest: "Նոր Հարցում",
        accessGranted: "Մուտքը թույլատրված է ✅",
        accessDenied: "Մուտքը մերժված է ❌",
        idBlocked: "Ձեր ID-ն արգելափակված է",
        idExists: "Այս ID-ն արդեն գոյություն ունի",
        pending: "Ձեր մուտքի հարցումը սպասման մեջ է",
        invalidId: "Մուտքագրեք ճիշտ 6-անիշ ID\nՕգտագործեք միայն A-Z և 0-9",
        sending: "Հարցումն ուղարկվում է..",
        verificationError: "Ստուգման ընթացքում սխալ առաջացավ",
        generalError: "Սխալ առաջացավ \nԽնդրում ենք կրկին փորձել"
      },

      ru: {
        title: "Запрос доступа",
        description: "Создайте 6-значный ID для запроса доступа",
        request: "Запрос",
        newRequest: "Новый запрос",
        accessGranted: "Доступ разрешён ✅",
        accessDenied: "Доступ запрещён ❌",
        idBlocked: "Ваш ID заблокирован",
        idExists: "Этот ID уже существует",
        pending: "Ваш запрос на доступ ожидает рассмотрения.",
        invalidId: "Введите правильный 6-значный ID\nИспользуйте только A-Z и 0-9",
        sending: "Запрос отправляется..",
        verificationError: "Произошла ошибка при проверке.",
        generalError: "Произошла ошибка. Попробуйте ещё раз."
      }
    };

    const currentLanguage =
      localStorage.getItem(LANGUAGE_KEY) || "en";

    const t = translations[currentLanguage] || translations.en;

    document.documentElement.lang = currentLanguage;
    document.title = t.title;

    title.textContent = t.title;
    description.textContent = t.description;
    submitBtn.textContent = t.request;

    function setMessage(text, className = "") {
      message.textContent = text;
      message.className = "message " + className;
    }

    function validDeviceId(id) {
      return /^[A-Z0-9]{6}$/.test(id);
    }

    async function callFunction(body) {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    function stopStatusPolling() {
      if (statusTimer) {
        clearInterval(statusTimer);
        statusTimer = null;
      }
    }

    function showApproved() {
      if (redirecting) {
        return;
      }

      redirecting = true;
      stopStatusPolling();

      setMessage(t.accessGranted, "approved");

      redirectTimer = setTimeout(() => {
        window.location.href = "./transportationPrice.html";
      }, 500);
    }

    function showRejected() {
      if (redirecting) {
        return;
      }

      redirecting = true;
      stopStatusPolling();

      setMessage(t.accessDenied, "rejected");

      redirectTimer = setTimeout(() => {
        window.location.href = "./entry.html";
      }, 500);
    }

    function showBlocked() {
      stopStatusPolling();

      redirecting = false;
      currentDeviceId = null;

      deviceInput.value = "";
      deviceInput.placeholder = "PULSE1";
      deviceInput.disabled = false;

      submitBtn.disabled = false;
      submitBtn.textContent = t.newRequest;

      setMessage(t.idBlocked, "rejected");
    }

    function showExistingId() {
      stopStatusPolling();

      redirecting = false;
      currentDeviceId = null;

      deviceInput.disabled = false;
      submitBtn.disabled = false;
      submitBtn.textContent = t.newRequest;

      setMessage(t.idExists, "rejected");
    }

    function showStatus(status) {
      if (status === "approved") {
        showApproved();

      } else if (status === "pending") {
        deviceInput.disabled = true;
        submitBtn.disabled = true;
        submitBtn.textContent = t.request;

        setMessage(t.pending, "waiting");

      } else if (status === "rejected") {
        showRejected();

      } else if (status === "not_found") {
        showBlocked();
      }
    }

    async function pollStatus() {
      if (!currentDeviceId || redirecting) {
        return;
      }

      try {
        const data = await callFunction({
          action: "check",
          device_id: currentDeviceId
        });

        showStatus(data.status);

      } catch (error) {
        console.error("Status polling error:", error);
      }
    }

    function startStatusPolling(deviceId) {
      currentDeviceId = deviceId;

      stopStatusPolling();

      pollStatus();

      statusTimer = setInterval(() => {
        pollStatus();
      }, 1000);
    }

    async function checkSavedDevice() {
      const savedId = localStorage.getItem(STORAGE_KEY);

      if (!savedId) {
        return;
      }

      deviceInput.value = savedId;
      deviceInput.disabled = true;
      submitBtn.disabled = true;

      currentDeviceId = savedId;

      try {
        const data = await callFunction({
          action: "check",
          device_id: savedId
        });

        showStatus(data.status);

        if (data.status === "pending") {
          startStatusPolling(savedId);
        }

      } catch (error) {
        setMessage(t.verificationError, "rejected");
        console.error(error);
      }
    }

    submitBtn.addEventListener("click", async () => {
      const deviceId = deviceInput.value.trim().toUpperCase();

      if (!validDeviceId(deviceId)) {
        setMessage(t.invalidId, "rejected");
        return;
      }

      stopStatusPolling();

      if (redirectTimer) {
        clearTimeout(redirectTimer);
        redirectTimer = null;
      }

      redirecting = false;
      currentDeviceId = null;

      submitBtn.disabled = true;
      deviceInput.disabled = true;
      submitBtn.textContent = t.request;

      setMessage(t.sending, "waiting");

      try {
        const checkData = await callFunction({
          action: "check",
          device_id: deviceId
        });

        if (checkData.exists === true) {
          showExistingId();
          return;
        }

        const data = await callFunction({
          device_id: deviceId
        });

        localStorage.setItem(STORAGE_KEY, deviceId);

        showStatus(data.status);

        if (data.status === "pending") {
          startStatusPolling(deviceId);
        }

      } catch (error) {
        deviceInput.disabled = false;
        submitBtn.disabled = false;
        submitBtn.textContent = t.newRequest;

        setMessage(t.generalError, "rejected");

        console.error(error);
      }
    });

    checkSavedDevice();
  </script>
</body>
</html>
