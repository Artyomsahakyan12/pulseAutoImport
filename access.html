<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Request</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 25px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

    .waiting {
      color: #b7791f;
    }

    .rejected {
      color: #d93025;
    }

    .approved {
      color: #188038;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Access Request</h1>

    <p id="description">
      Create 6-digit ID to request access
    </p>

    <input
      id="deviceId"
      type="text"
      maxlength="6"
      autocomplete="off"
      placeholder="PULSE1"
    >

    <button id="submitBtn">Request</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const FUNCTION_URL =
      "https://yusznijfwkdcvrrqqapz.supabase.co/functions/v1/telegram-access";

    const STORAGE_KEY = "pulseAutoImportDeviceId";

    const deviceInput = document.getElementById("deviceId");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const description = document.getElementById("description");

    let statusTimer = null;
    let currentDeviceId = null;
    let redirectTimer = null;
    let redirecting = false;

    function setMessage(text, className = "") {
      message.textContent = text;
      message.className = "message " + className;
    }

    function validDeviceId(id) {
      return /^[A-Z0-9]{6}$/.test(id);
    }

    async function callFunction(body) {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    function stopStatusPolling() {
      if (statusTimer) {
        clearInterval(statusTimer);
        statusTimer = null;
      }
    }

    function showApproved() {
      if (redirecting) {
        return;
      }

      redirecting = true;
      stopStatusPolling();

      setMessage("Access granted ✅", "approved");

      redirectTimer = setTimeout(() => {
        window.location.href = "./transportationPrice.html";
      }, 500);
    }

    function showRejected() {
      if (redirecting) {
        return;
      }

      redirecting = true;
      stopStatusPolling();

      setMessage("Access denied ❌", "rejected");

      redirectTimer = setTimeout(() => {
        window.location.href = "./entry.html";
      }, 500);
    }

    function showBlocked() {
      stopStatusPolling();

      redirecting = false;
      currentDeviceId = null;

      deviceInput.value = "";
      deviceInput.placeholder = "PULSE1";
      deviceInput.disabled = false;

      submitBtn.disabled = false;
      submitBtn.textContent = "New Request";

      setMessage("Your ID blocked", "rejected");
    }

    function showExistingId() {
      stopStatusPolling();

      redirecting = false;
      currentDeviceId = null;

      deviceInput.disabled = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "New Request";

      setMessage("This ID already exists", "rejected");
    }

    function showStatus(status) {
      if (status === "approved") {
        showApproved();

      } else if (status === "pending") {
        deviceInput.disabled = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Request";

        setMessage(
          "Your access request is pending.",
          "waiting"
        );

      } else if (status === "rejected") {
        showRejected();

      } else if (status === "not_found") {
        showBlocked();
      }
    }

    async function pollStatus() {
      if (!currentDeviceId || redirecting) {
        return;
      }

      try {
        const data = await callFunction({
          action: "check",
          device_id: currentDeviceId
        });

        showStatus(data.status);

      } catch (error) {
        console.error("Status polling error:", error);
      }
    }

    function startStatusPolling(deviceId) {
      currentDeviceId = deviceId;

      stopStatusPolling();

      pollStatus();

      statusTimer = setInterval(() => {
        pollStatus();
      }, 1000);
    }

    async function checkSavedDevice() {
      const savedId = localStorage.getItem(STORAGE_KEY);

      if (!savedId) {
        return;
      }

      deviceInput.value = savedId;
      deviceInput.disabled = true;
      submitBtn.disabled = true;

      currentDeviceId = savedId;

      try {
        const data = await callFunction({
          action: "check",
          device_id: savedId
        });

        showStatus(data.status);

        if (data.status === "pending") {
          startStatusPolling(savedId);
        }

      } catch (error) {
        setMessage(
          "An error occurred during verification.",
          "rejected"
        );

        console.error(error);
      }
    }

    submitBtn.addEventListener("click", async () => {
      const deviceId = deviceInput.value.trim().toUpperCase();

      if (!validDeviceId(deviceId)) {
        setMessage(
          "Enter a valid 6-digit ID \nuse only A-Z and 0-9",
          "rejected"
        );
        return;
      }

      stopStatusPolling();

      if (redirectTimer) {
        clearTimeout(redirectTimer);
        redirectTimer = null;
      }

      redirecting = false;
      currentDeviceId = null;

      submitBtn.disabled = true;
      deviceInput.disabled = true;
      submitBtn.textContent = "Request";

      setMessage("Sending request..", "waiting");

      try {
        const checkData = await callFunction({
          action: "check",
          device_id: deviceId
        });

        if (checkData.exists === true) {
          showExistingId();
          return;
        }

        const data = await callFunction({
          device_id: deviceId
        });

        localStorage.setItem(STORAGE_KEY, deviceId);

        showStatus(data.status);

        if (data.status === "pending") {
          startStatusPolling(deviceId);
        }

      } catch (error) {
        deviceInput.disabled = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "New Request";

        setMessage(
          "An error occurred. Please try again.",
          "rejected"
        );

        console.error(error);
      }
    });

    checkSavedDevice();
  </script>
</body>
</html>
