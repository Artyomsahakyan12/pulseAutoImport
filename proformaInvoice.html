<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Կանխավճարի հաշիվ</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#161b27;--mut:#6b7280;--bd:#dfe2e8;--red:#e8141c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2c3445}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202c;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2c3445}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Noto Sans Armenian",sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
input[type=date]{min-height:48px;text-align:left;-webkit-appearance:none;appearance:none}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font:600 17px system-ui,sans-serif}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;margin-top:18px;background:#fff}
#m{color:var(--mut);font-size:14px;margin-top:10px;min-height:20px}

<button id="b">Ներբեռնել PDF</button><div id="m"></div><canvas id="c"></canvas></div>
