<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Proforma Invoice">

<title>Proforma Invoice</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Arial, sans-serif;
        background: #f5f6f8;
        color: #171717;
        padding: 24px 16px 40px;
    }

    .page {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
    }

    .header {
        text-align: center;
        margin-bottom: 24px;
    }

    .header h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
    }

    .header p {
        margin: 7px 0 0;
        color: #777;
        font-size: 14px;
    }

    .card {
        background: #fff;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .field {
        margin-bottom: 16px;
    }

    .field:last-of-type {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;
        height: 48px;
        border: 1px solid #d9dce1;
        border-radius: 12px;
        padding: 0 14px;
        font-size: 16px;
        outline: none;
        background: #fafafa;
        -webkit-appearance: none;
    }

    input:focus {
        border-color: #777;
        background: #fff;
    }

    .button {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 13px;
        background: #171717;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .button:disabled {
        opacity: .55;
        cursor: default;
    }

    .status {
        min-height: 22px;
        margin-top: 14px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }

    .error {
        color: #b42318;
    }

    .success {
        color: #087443;
    }

    .hint {
        margin-top: 14px;
        color: #888;
        font-size: 12px;
        line-height: 1.45;
        text-align: center;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

</head>

<body>

<div class="page">

    <div class="header">
        <h1>Proforma Invoice</h1>
        <p>Լրացրու փոփոխվող դաշտերը</p>
    </div>

    <div class="card">

        <!-- Գնորդ -->
        <div class="field">
            <label for="buyer">Գնորդ</label>

            <input
                id="buyer"
                type="text"
                autocomplete="name"
                placeholder="Մուտքագրիր գնորդի անունը"
            >
        </div>


        <!-- Մակնիշ -->
        <div class="field">
            <label for="make">Մակնիշ</label>

            <input
                id="make"
                type="text"
                placeholder="Օր․ 2023 KIA Forte LXS"
            >
        </div>


        <!-- VIN -->
        <div class="field">
            <label for="vin">Նույնականացման համար</label>

            <input
                id="vin"
                type="text"
                autocapitalize="characters"
                placeholder="Մուտքագրիր VIN-ը"
            >
        </div>


        <!-- Գումար -->
        <div class="field">
            <label for="amount">Վճարման ենթակա գումար</label>

            <input
                id="amount"
                type="text"
                inputmode="decimal"
                placeholder="Օր․ 1.446.000 դրամ"
            >
        </div>


        <!-- Ամսաթիվ -->
        <div class="field">
            <label for="date">Ամսաթիվ</label>

            <input
                id="date"
                type="text"
                placeholder="Օր․ 11.08.2026"
            >
        </div>


        <!-- Generate -->
        <button
            class="button"
            id="generateButton"
            onclick="generateWord()"
        >
            Ստեղծել Word
        </button>


        <div
            class="status"
            id="status"
        ></div>


        <div class="hint">
            Word template-ը պետք է գտնվի այս HTML էջի նույն
            թղթապանակում՝
            <b>proforma-template.docx</b>
            անունով։
        </div>

    </div>

</div>


<script>

const TEMPLATE_URL = "./proforma-template.docx";


async function generateWord() {

    const buyer =
        document.getElementById("buyer").value.trim();

    const make =
        document.getElementById("make").value.trim();

    const vin =
        document.getElementById("vin").value.trim();

    const amount =
        document.getElementById("amount").value.trim();

    const date =
        document.getElementById("date").value.trim();


    const status =
        document.getElementById("status");

    const button =
        document.getElementById("generateButton");


    /*
     * Ստուգում ենք՝ բոլոր 5 դաշտերը լրացված են
     */

    if (
        !buyer ||
        !make ||
        !vin ||
        !amount ||
        !date
    ) {

        status.className = "status error";

        status.textContent =
            "Լրացրու բոլոր 5 դաշտերը։";

        return;
    }


    button.disabled = true;

    status.className = "status";

    status.textContent =
        "Պատրաստվում է Word ֆայլը…";


    try {

        /*
         * Բեռնում ենք Word template-ը
         */

        const response =
            await fetch(
                TEMPLATE_URL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Template file was not found."
            );
        }


        const originalDocx =
            await response.arrayBuffer();


        /*
         * Բացում ենք DOCX-ը որպես ZIP
         */

        const zip =
            await JSZip.loadAsync(
                originalDocx
            );


        /*
         * Վերցնում ենք Word-ի մեջ գտնվող image1.png-ը
         */

        const imageBlob =
            await zip
                .file("word/media/image1.png")
                .async("blob");


        const imageBitmap =
            await createImageBitmap(
                imageBlob
            );


        /*
         * Ստեղծում ենք canvas
         */

        const canvas =
            document.createElement("canvas");


        canvas.width =
            imageBitmap.width;

        canvas.height =
            imageBitmap.height;


        const ctx =
            canvas.getContext("2d");


        /*
         * Նկարը նկարում ենք canvas-ի վրա
         */

        ctx.drawImage(
            imageBitmap,
            0,
            0
        );


        /*
         * ============================
         * ՓՈՓՈԽՎՈՂ ԴԱՇՏԵՐ
         * ============================
         */


        // Գնորդ
        coverAndWrite(
            ctx,
            250,
            695,
            1120,
            750,
            buyer,
            26
        );


        // Մակնիշ
        coverAndWrite(
            ctx,
            275,
            900,
            1120,
            955,
            make,
            26
        );


        // Նույնականացման համար / VIN
        coverAndWrite(
            ctx,
            300,
            985,
            1120,
            1045,
            vin,
            26
        );


        // Վճարման ենթակա գումար
        coverAndWrite(
            ctx,
            285,
            1075,
            1120,
            1130,
            amount,
            26
        );


        // Ամսաթիվ
        coverAndWrite(
            ctx,
            805,
            1365,
            1110,
            1418,
            date,
            26
        );


        /*
         * Canvas-ը նոր PNG-ի ենք վերածում
         */

        const newImageBlob =
            await new Promise(
                resolve =>
                    canvas.toBlob(
                        resolve,
                        "image/png"
                    )
            );


        if (!newImageBlob) {

            throw new Error(
                "Could not create the new document image."
            );
        }


        /*
         * Նոր PNG-ն տեղադրում ենք
         * Word-ի մեջ
         */

        zip.file(
            "word/media/image1.png",
            newImageBlob
        );


        /*
         * Ստեղծում ենք նոր DOCX
         */

        const output =
            await zip.generateAsync({

                type: "blob",

                mimeType:
                    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

            });


        /*
         * Ֆայլի անուն
         */

        const safeBuyer =
            buyer
                .replace(
                    /[\\/:*?"<>|]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        const filename =
            `Proforma Invoice - ${safeBuyer || "Document"}.docx`;


        const file =
            new File(
                [output],
                filename,
                {
                    type:
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                }
            );


        /*
         * iPhone / iPad
         *
         * Եթե Share Sheet-ը հասանելի է,
         * օգտագործում ենք այն։
         */

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [file]
            })
        ) {

            await navigator.share({

                files: [file],

                title:
                    "Proforma Invoice"

            });

        }

        else {

            /*
             * Եթե Share API չկա,
             * ֆայլը ներբեռնում ենք
             */

            const url =
                URL.createObjectURL(
                    output
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                filename;


            document.body.appendChild(a);

            a.click();

            a.remove();


            setTimeout(
                () =>
                    URL.revokeObjectURL(
                        url
                    ),
                3000
            );
        }


        status.className =
            "status success";


        status.textContent =
            "Word ֆայլը պատրաստ է։";


    }

    catch (error) {

        console.error(error);


        status.className =
            "status error";


        status.textContent =
            "Չհաջողվեց ստեղծել Word-ը։ Ստուգիր template ֆայլի անունը։";
    }


    finally {

        button.disabled =
            false;
    }
}



/*
 * ==========================================
 * Տեքստի տեղադրման ֆունկցիա
 * ==========================================
 *
 * x1/y1/x2/y2 → տվյալ դաշտի տարածքը
 *
 * Եթե տեքստը երկար է,
 * font-size-ը ավտոմատ փոքրանում է։
 */

function coverAndWrite(
    ctx,
    x1,
    y1,
    x2,
    y2,
    text,
    baseSize
) {

    const padding = 5;


    ctx.save();


    /*
     * Հին արժեքը ծածկում ենք սպիտակով
     */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        x1,
        y1,
        x2 - x1,
        y2 - y1
    );


    /*
     * Սկզբնական font size
     */

    let size =
        baseSize;


    const maxWidth =
        (x2 - x1) -
        padding * 2;


    ctx.font =
        `700 ${size}px Arial, "Noto Sans Armenian", sans-serif`;


    /*
     * Եթե տեքստը չի տեղավորվում,
     * փոքրացնում ենք
     */

    while (
        ctx.measureText(text).width >
            maxWidth &&
        size > 15
    ) {

        size -= 1;


        ctx.font =
            `700 ${size}px Arial, "Noto Sans Armenian", sans-serif`;
    }


    /*
     * Տեքստի գույն
     */

    ctx.fillStyle =
        "#000000";


    ctx.textBaseline =
        "middle";


    /*
     * Նոր արժեքը գրում ենք
     */

    ctx.fillText(
        text,
        x1 + padding,
        (y1 + y2) / 2
    );


    ctx.restore();
}

</script>

</body>
</html>
