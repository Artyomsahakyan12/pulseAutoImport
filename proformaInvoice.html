<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Proforma Invoice">

<title>Proforma Invoice</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #202733;
    padding: 20px 14px 30px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

h1 {
    margin: 6px 0 18px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
}

.card {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.field {
    margin-bottom: 14px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
}

input {
    width: 100%;
    height: 46px;
    border: 1px solid #d8dce2;
    border-radius: 10px;
    padding: 0 13px;
    font-size: 16px;
    outline: none;
    background: #ffffff;
}

input:focus {
    border-color: #d71920;
    box-shadow: 0 0 0 3px rgba(215,25,32,.10);
}

button {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.generate {
    color: #ffffff;
    background: #d71920;
    margin-top: 4px;
}

.generate:disabled {
    opacity: .6;
}

.clear {
    color: #202733;
    background: #eef0f3;
    margin-top: 10px;
    display: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: #202733;
    text-decoration: none;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Proforma Invoice</h1>

    <div class="card">

        <!-- DATE -->
        <div class="field">

            <label for="invoice_date">
                Date
            </label>

<input
    id="invoice_date"
    type="text"
    inputmode="numeric"
    maxlength="10"
    placeholder="DD/MM/YYYY"
>

        </div>


        <!-- NAME -->
        <div class="field">

            <label for="customer_name">
                Name, Surname
            </label>

            <input
                id="customer_name"
                type="text"
                autocomplete="name"
            >

        </div>


        <!-- PASSPORT -->
        <div class="field">

            <label for="passport">
                Passport / ID card
            </label>

            <input
                id="passport"
                type="text"
            >

        </div>


        <!-- MANUFACTURER -->
        <div class="field">

            <label for="make">
                Manufacturer
            </label>

            <input
                id="make"
                type="text"
            >

        </div>


        <!-- MODEL -->
        <div class="field">

            <label for="model">
                Model
            </label>

            <input
                id="model"
                type="text"
            >

        </div>


        <!-- YEAR -->
        <div class="field">

            <label for="year">
                Year
            </label>

            <input
                id="year"
                type="text"
                inputmode="numeric"
            >

        </div>


        <!-- VIN -->
        <div class="field">

            <label for="vin">
                VIN
            </label>

            <input
                id="vin"
                type="text"
                autocapitalize="characters"
            >

        </div>


        <!-- AMOUNT -->
        <div class="field">

            <label for="amount">
                Due to payment (AMD)
            </label>

            <input
                id="amount"
                type="text"
                inputmode="decimal"
            >

        </div>


        <button
            class="generate"
            id="generateBtn"
            type="button"
        >
            Generate PDF
        </button>


        <button
            class="clear"
            id="clearBtn"
            type="button"
        >
            Clear
        </button>

    </div>


    <a
        class="back"
        href="./entry.html"
    >
        ‹ Back
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<script>

const PDF_FILE = "./proformaInvoice-template.pdf";


/* =========================================
   FIELD LIST
========================================= */

const fields = [
    "invoice_date",
    "customer_name",
    "passport",
    "make",
    "model",
    "year",
    "vin",
    "amount"
];


function getValue(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}

/* =========================================
   SHOW / HIDE CLEAR BUTTON
========================================= */

function updateClearButton() {

    const hasText = fields.some(id => {

        return document
            .getElementById(id)
            .value
            .trim() !== "";

    });

document
    .getElementById("clearBtn")
    .addEventListener("click", () => {

        fields.forEach(id => {

            document
                .getElementById(id)
                .value = "";

        });

        updateClearButton();

    });

/* =========================================
   AUTO DATE SLASHES
========================================= */

document
    .getElementById("invoice_date")
    .addEventListener("input", function () {

        let value = this.value.replace(/\D/g, "");

        if (value.length > 8) {
            value = value.slice(0, 8);
        }

        if (value.length > 4) {

            value =
                value.slice(0, 2) +
                "/" +
                value.slice(2, 4) +
                "/" +
                value.slice(4);

        } else if (value.length > 2) {

            value =
                value.slice(0, 2) +
                "/" +
                value.slice(2);

        }

        this.value = value;

    });


/* =========================================
   CLEAR
========================================= */

document
    .getElementById("clearBtn")
    .addEventListener("click", () => {

        fields.forEach(id => {

            document
                .getElementById(id)
                .value = "";

        });
    });


/* =========================================
   GENERATE PDF
========================================= */

document
    .getElementById("generateBtn")
    .addEventListener("click", async () => {

        const button =
            document.getElementById("generateBtn");


        try {

            button.disabled = true;

            /* =================================
               LOAD TEMPLATE
            ================================= */

            const response =
                await fetch(
                    PDF_FILE,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load proformaInvoice-template.pdf"
                );

            }


            const pdfBytes =
                await response.arrayBuffer();


            /* =================================
               OPEN PDF
            ================================= */

            const pdfDoc =
                await PDFLib.PDFDocument.load(
                    pdfBytes
                );


            const page =
                pdfDoc.getPages()[0];


            const {
                width,
                height
            } = page.getSize();


            /* =================================
               FONT
            ================================= */

            const font =
    await pdfDoc.embedFont(
        PDFLib.StandardFonts.HelveticaBold
    );


            /* =================================
               USER VALUES
            ================================= */

            const invoiceDate =
                getValue("invoice_date");

            const customerName =
                getValue("customer_name");

            const passport =
                getValue("passport");

            const make =
                getValue("make");

            const model =
                getValue("model");

            const year =
                getValue("year");

            const vin =
                getValue("vin");

            const amount =
                getValue("amount");


            /*
             * AMD is added automatically.
             */

            const amountWithCurrency =
                amount
                    ? amount + " AMD"
                    : "";


            /* =================================
               PDF / IMAGE SCALE

               Original artwork:
               1086 × 1448 px
            ================================= */

            const IMAGE_WIDTH = 1086;
            const IMAGE_HEIGHT = 1448;


            const SX =
                width / IMAGE_WIDTH;

            const SY =
                height / IMAGE_HEIGHT;


            function X(px) {

                return px * SX;

            }


            function TOP(px) {

                return px * SY;

            }


            /* =================================
               WRITE TEXT
            ================================= */

            function writeText(
                text,
                imageX,
                imageTop,
                fontSize,
                color,
                maxWidthPx
            ) {

                if (!text) {
                    return;
                }


                let size =
                    fontSize;


                const maxWidth =
                    maxWidthPx
                        ? X(maxWidthPx)
                        : null;


                let textWidth =
                    font.widthOfTextAtSize(
                        text,
                        size
                    );


                /*
                 * Automatically reduce font
                 * if text is too long.
                 */

                if (
                    maxWidth &&
                    textWidth > maxWidth
                ) {

                    size *=
                        maxWidth /
                        textWidth;

                }


                page.drawText(
                    text,
                    {

                        x:
                            X(imageX),

                        y:
                            height -
                            TOP(imageTop) -
                            size -
                            1.5,

                        size:
                            size,

                        font:
                            font,

                        color:
                            color

                    }
                );

            }


            /* =================================
               COLORS
            ================================= */

            const dark =
                PDFLib.rgb(
                    0.12,
                    0.15,
                    0.20
                );


            const red =
                PDFLib.rgb(
                    0.84,
                    0.05,
                    0.08
                );


            /*
             * NO COVER RECTANGLES.
             *
             * Original PDF design stays untouched.
             */


            /* =================================
               DATE
               
               FIXED COORDINATE
            ================================= */

            writeText(
                invoiceDate,
                815,
                333,
                13,
                dark,
                145
            );


            /* =================================
               CUSTOMER NAME

               FIXED COORDINATE
            ================================= */

            writeText(
                customerName,
                251,
                439,
                10,
                dark,
                218
            );


            /* =================================
               PASSPORT / ID CARD

               FIXED COORDINATE
            ================================= */

            writeText(
                passport,
                261,
                484,
                10,
                dark,
                218
            );


            /* =================================
               MANUFACTURER

               FIXED COORDINATE
            ================================= */

            writeText(
                make,
                798,
                439,
                10,
                dark,
                220
            );


            /* =================================
               MODEL

               FIXED COORDINATE
            ================================= */

            writeText(
                model,
                751,
                483,
                10,
                dark,
                220
            );


            /* =================================
               YEAR

               FIXED COORDINATE
            ================================= */

            writeText(
                year,
                741,
                526,
                10,
                dark,
                220
            );


            /* =================================
               VIN

               FIXED COORDINATE
            ================================= */

            writeText(
                vin,
                736,
                571,
                10,
                dark,
                220
            );


            /* =================================
               DUE TO PAYMENT

               FIXED COORDINATE

               AMD automatically added.
            ================================= */

            writeText(
                amountWithCurrency,
                357,
                738,
                10,
                red,
                150
            );


            /* =================================
               SAVE PDF
            ================================= */

            const finalPdf =
                await pdfDoc.save();


            const blob =
                new Blob(
                    [finalPdf],
                    {
                        type:
                            "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            /* =================================
               FILE NAME
            ================================= */

            let safeName =
                customerName ||
                "Customer";


            safeName =
                safeName
                    .replace(
                        /[\\/:*?"<>|]+/g,
                        "_"
                    )
                    .trim();


            const fileName =
                "Proforma_Invoice_" +
                safeName +
                ".pdf";


            /* =================================
               DOWNLOAD
            ================================= */

            const link =
                document.createElement("a");


            link.href =
                url;


            link.download =
                fileName;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );
        }
        catch (error) {

            console.error(
                "PDF ERROR:",
                error
            );
        }
        finally {

            button.disabled = false;

        }

    });

</script>

</body>
</html>
