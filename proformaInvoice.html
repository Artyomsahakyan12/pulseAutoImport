<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="Proforma Invoice"
>

<title>Proforma Invoice</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    background: #f4f5f7;
    color: #202733;

    padding:
        20px
        14px
        30px;
}


.container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}


h1 {
    margin:
        6px
        0
        18px;

    text-align: center;

    font-size: 24px;
    font-weight: 700;
}


.card {
    background: #ffffff;

    border-radius: 16px;

    padding: 18px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.08);
}


.field {
    margin-bottom: 14px;
}


label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;
    font-weight: 700;
}


/* =========================================
   INPUT WRAPPER
========================================= */

.field-input {
    position: relative;
}


/* =========================================
   INPUT
========================================= */

input {
    width: 100%;
    height: 46px;

    border:
        1px solid
        #d8dce2;

    border-radius: 10px;

    padding:
        0
        46px
        0
        13px;

    font-size: 16px;

    outline: none;

    background: #ffffff;
}


input:focus {
    border-color: #d71920;

    box-shadow:
        0 0 0 3px
        rgba(215,25,32,.10);
}


/* =========================================
   INDIVIDUAL X BUTTON
========================================= */

.field-clear-btn {
    display: none;

    position: absolute;

    right: 7px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 30px !important;
    height: 30px !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0;

    border-radius: 50%;

    background: #eef1f5;

    color: #697386;

    font-size: 19px;

    font-weight: 500;

    line-height: 30px;

    cursor: pointer;

    appearance: none;

    z-index: 10;
}


.field-clear-btn.visible {
    display: block;
}


/* =========================================
   BUTTONS
========================================= */

button {
    width: 100%;
    height: 50px;

    border: 0;

    border-radius: 11px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}


.generate {
    color: #ffffff;

    background: #d71920;

    margin-top: 4px;
}


.generate:disabled {
    opacity: .6;
}


.clear {
    display: block;
    width: 100%;
    height: 50px;
    color: #202733;
    background: #eef0f3;
    margin-top: 10px;
    opacity: 0.35;
    transition: opacity 0.2s ease;
}

.clear.active {
    opacity: 1;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Proforma Invoice
    </h1>


    <div class="card">


        <!-- =================================
             DATE
        ================================== -->

        <div class="field">

            <label for="invoice_date">
                Date
            </label>

            <div class="field-input">

                <input
                    id="invoice_date"
                    type="text"
                    inputmode="numeric"
                    maxlength="10"
                    placeholder="DD/MM/YYYY"
                >

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="invoice_date"
                    aria-label="Clear date"
                >×</button>

            </div>

        </div>


        <!-- =================================
             NAME
        ================================== -->

        <div class="field">

            <label for="customer_name">
                Name, Surname
            </label>

            <div class="field-input">

                <input
    id="customer_name"
    type="text"
    autocomplete="name"
    placeholder="Elon Musk"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="customer_name"
                    aria-label="Clear name"
                >×</button>

            </div>

        </div>


        <!-- =================================
             PASSPORT
        ================================== -->

        <div class="field">

            <label for="passport">
                Passport / ID card
            </label>

            <div class="field-input">

              <input
    id="passport"
    type="text"
    placeholder="AX0788563 / 012647683"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="passport"
                    aria-label="Clear passport"
                >×</button>

            </div>

        </div>


        <!-- =================================
             MANUFACTURER
        ================================== -->

        <div class="field">

            <label for="make">
                Manufacturer
            </label>

            <div class="field-input">

             <input
    id="make"
    type="text"
    placeholder="Nissan"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="make"
                    aria-label="Clear manufacturer"
                >×</button>

            </div>

        </div>


        <!-- =================================
             MODEL
        ================================== -->

        <div class="field">

            <label for="model">
                Model
            </label>

            <div class="field-input">

               <input
    id="model"
    type="text"
    placeholder="Bluebird Sylphy"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="model"
                    aria-label="Clear model"
                >×</button>

            </div>

        </div>


        <!-- =================================
             YEAR
        ================================== -->

        <div class="field">

            <label for="year">
                Year
            </label>

            <div class="field-input">

               <input
    id="year"
    type="text"
    inputmode="numeric"
    placeholder="2006"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="year"
                    aria-label="Clear year"
                >×</button>

            </div>

        </div>


        <!-- =================================
             VIN
        ================================== -->

        <div class="field">

            <label for="vin">
                VIN
            </label>

            <div class="field-input">

    <input
    id="vin"
    type="text"
    autocapitalize="characters"
    placeholder="JM3KE4CY8F0539694"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="vin"
                    aria-label="Clear VIN"
                >×</button>

            </div>

        </div>


        <!-- =================================
             AMOUNT
        ================================== -->

        <div class="field">

            <label for="amount">
                Due to payment (AMD)
            </label>

            <div class="field-input">

            <input
    id="amount"
    type="text"
    inputmode="numeric"
    placeholder="1964367"
>

                <button
                    class="field-clear-btn"
                    type="button"
                    data-clear="amount"
                    aria-label="Clear amount"
                >×</button>

            </div>

        </div>


        <!-- =================================
             GENERATE
        ================================== -->

        <button
            class="generate"
            id="generateBtn"
            type="button"
        >
            Generate PDF
        </button>


        <!-- =================================
             GLOBAL CLEAR
        ================================= -->

        <button
            class="clear"
            id="clearBtn"
            type="button"
        >
            Clear
        </button>


    </div>
</div>

<!-- =========================================
     PDF-LIB
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<script>


const PDF_FILE =
    "./proformaInvoice-template.pdf";


/* =========================================
   FIELD LIST
========================================= */

const fields = [

    "invoice_date",

    "customer_name",

    "passport",

    "make",

    "model",

    "year",

    "vin",

    "amount"

];


function getValue(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}


/* =========================================
   GLOBAL CLEAR BUTTON VISIBILITY
========================================= */

function updateGlobalClearButton() {

    const hasText =
        fields.some(id => {

            return document
                .getElementById(id)
                .value
                .trim() !== "";

        });


    document
        .getElementById("clearBtn")
        .classList.toggle(
            "active",
            hasText
        );

}


/* =========================================
   INDIVIDUAL FIELD CLEAR BUTTONS
========================================= */

document
    .querySelectorAll(".field-clear-btn")
    .forEach(button => {

        const fieldId =
            button.dataset.clear;

        const input =
            document.getElementById(
                fieldId
            );


        function updateButton() {

            button.classList.toggle(
                "visible",
                input.value.trim().length > 0
            );

        }


        input.addEventListener(
            "input",
            () => {

                updateButton();

                updateGlobalClearButton();

            }
        );


        button.addEventListener(
            "click",
            () => {

                input.value = "";

                updateButton();

                updateGlobalClearButton();

                input.focus();

            }
        );


        updateButton();

    });


/* =========================================
   INITIAL GLOBAL CLEAR STATE
========================================= */

updateGlobalClearButton();


/* =========================================
   AUTO DATE SLASHES

   19092026
   ↓
   19/09/2026
========================================= */

document
    .getElementById("invoice_date")
    .addEventListener(
        "input",
        function () {

            let value =
                this.value.replace(
                    /\D/g,
                    ""
                );


            if (value.length > 8) {

                value =
                    value.slice(
                        0,
                        8
                    );

            }


            if (value.length > 4) {

                value =
                    value.slice(0, 2) +
                    "/" +
                    value.slice(2, 4) +
                    "/" +
                    value.slice(4);

            }

            else if (value.length > 2) {

                value =
                    value.slice(0, 2) +
                    "/" +
                    value.slice(2);

            }


            this.value =
                value;

        }
    );
    
    document
    .getElementById("vin")
    .addEventListener(
        "input",
        function () {
            this.value = this.value.toUpperCase();
        }
    );
    
    document
    .getElementById("passport")
    .addEventListener(
        "input",
        function () {
            this.value = this.value.toUpperCase();
        }
    );
    
    document
    .getElementById("customer_name")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\b\p{L}/gu, letter =>
                        letter.toUpperCase()
                    );

        }
    );


/* =========================================
   GLOBAL CLEAR

   Clears ALL fields
========================================= */

document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        () => {

            fields.forEach(id => {

                document
                    .getElementById(id)
                    .value = "";

            });


            document
                .querySelectorAll(
                    ".field-clear-btn"
                )
                .forEach(button => {

                    button.classList.remove(
                        "visible"
                    );

                });


            updateGlobalClearButton();

        }
    );


/* =========================================
   GENERATE PDF
========================================= */

document
    .getElementById("generateBtn")
    .addEventListener(
        "click",
        async () => {

            const button =
                document.getElementById(
                    "generateBtn"
                );


            try {

                button.disabled = true;


                /* =============================
                   LOAD TEMPLATE
                ============================= */

                const response =
                    await fetch(
                        PDF_FILE,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load proformaInvoice-template.pdf"
                    );

                }


                const pdfBytes =
                    await response.arrayBuffer();


                /* =============================
                   OPEN PDF
                ============================= */

                const pdfDoc =
                    await PDFLib
                        .PDFDocument
                        .load(
                            pdfBytes
                        );


                const page =
                    pdfDoc
                        .getPages()[0];


                const {
                    width,
                    height
                } =
                    page.getSize();


                /* =============================
                   BOLD FONT
                ============================= */

                const font =
                    await pdfDoc.embedFont(
                        PDFLib
                            .StandardFonts
                            .HelveticaBold
                    );


                /* =============================
                   USER VALUES
                ============================= */

                const invoiceDate =
                    getValue(
                        "invoice_date"
                    );


                const customerName =
                    getValue(
                        "customer_name"
                    );


                const passport =
                    getValue(
                        "passport"
                    );


                const make =
                    getValue(
                        "make"
                    );


                const model =
                    getValue(
                        "model"
                    );


                const year =
                    getValue(
                        "year"
                    );


                const vin =
                    getValue(
                        "vin"
                    );


                const amount =
                    getValue(
                        "amount"
                    );


                /* =============================
                   AMOUNT + AMD
                ============================= */

                const amountWithCurrency =
                    amount
                        ? amount + " AMD"
                        : "";


                /* =============================
                   PDF / IMAGE SCALE

                   Original artwork:
                   1086 × 1448
                ============================= */

                const IMAGE_WIDTH =
                    1086;


                const IMAGE_HEIGHT =
                    1448;


                const SX =
                    width /
                    IMAGE_WIDTH;


                const SY =
                    height /
                    IMAGE_HEIGHT;


                function X(px) {

                    return px * SX;

                }


                function TOP(px) {

                    return px * SY;

                }


                /* =============================
                   WRITE TEXT
                ============================= */

                function writeText(
                    text,
                    imageX,
                    imageTop,
                    fontSize,
                    color,
                    maxWidthPx
                ) {

                    if (!text) {

                        return;

                    }


                    let size =
                        fontSize;


                    const maxWidth =
                        maxWidthPx
                            ? X(maxWidthPx)
                            : null;


                    let textWidth =
                        font.widthOfTextAtSize(
                            text,
                            size
                        );


                    /*
                     * Automatically reduce
                     * font size if text is
                     * too long.
                     */

                    if (
                        maxWidth &&
                        textWidth > maxWidth
                    ) {

                        size *=
                            maxWidth /
                            textWidth;

                    }


                    page.drawText(
                        text,
                        {

                            x:
                                X(imageX),

                            y:
                                height -
                                TOP(imageTop) -
                                size -
                                1.5,

                            size:
                                size,

                            font:
                                font,

                            color:
                                color

                        }
                    );

                }


                /* =============================
                   COLORS
                ============================= */

                const dark =
                    PDFLib.rgb(
                        0.12,
                        0.15,
                        0.20
                    );


                const red =
                    PDFLib.rgb(
                        0.84,
                        0.05,
                        0.08
                    );


                /*
                 * NO COVER RECTANGLES.
                 *
                 * Original PDF background
                 * remains untouched.
                 */


                /* =============================
                   DATE
                ============================= */

                writeText(
                    invoiceDate,
                    815,
                    333,
                    13,
                    dark,
                    180
                );


                /* =============================
                   NAME
                ============================= */

                writeText(
                    customerName,
                    220,
                    465,
                    10,
                    dark,
                    218
                );


                /* =============================
                   PASSPORT
                ============================= */

                writeText(
                    passport,
                    247,
                    470,
                    10,
                    dark,
                    218
                );


                /* =============================
                   MANUFACTURER
                ============================= */

                writeText(
                    make,
                    805,
                    425,
                    10,
                    dark,
                    220
                );


                /* =============================
                   MODEL
                ============================= */

                writeText(
                    model,
                    760,
                    475,
                    10,
                    dark,
                    220
                );


                /* =============================
                   YEAR
                ============================= */

                writeText(
                    year,
                    750,
                    505,
                    10,
                    dark,
                    220
                );


                /* =============================
                   VIN
                ============================= */

                writeText(
                    vin,
                    745,
                    565,
                    10,
                    dark,
                    220
                );


                /* =============================
                   DUE TO PAYMENT
                ============================= */

                writeText(
                    amountWithCurrency,
                    357,
                    738,
                    10,
                    red,
                    250
                );


                /* =============================
                   SAVE PDF
                ============================= */

                const finalPdf =
                    await pdfDoc.save();


                const blob =
                    new Blob(
                        [finalPdf],
                        {
                            type:
                                "application/pdf"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                /* =============================
                   FILE NAME
                ============================= */

                let safeName =
                    customerName ||
                    "Customer";


                safeName =
                    safeName
                        .replace(
                            /[\\/:*?"<>|]+/g,
                            "_"
                        )
                        .trim();


                const fileName =
                    "Proforma_Invoice_" +
                    safeName +
                    ".pdf";


                /* =============================
                   DOWNLOAD
                ============================= */

                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    fileName;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            }

            catch (error) {

                console.error(
                    "PDF ERROR:",
                    error
                );

            }

            finally {

                button.disabled =
                    false;

            }

        }
    );

</script>

</body>
</html>
