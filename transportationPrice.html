<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<title>PulseAutoImport</title>

   <link rel="preload" as="image" href="./iaai-logo.PNG">
   <link rel="preload" as="image" href="./copart-logo.PNG">
   <link rel="icon" type="image/png" href="./pulseAutoImport-logo.PNG">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7fa;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
    max-width:700px;
    margin:auto;
    padding:55px 18px
}

h1{
    text-align:center;
    font-size:34px;
    margin:10px 0 8px;
}

.sub{
    text-align:center;
    color:#7d8695;
    margin-bottom:28px;
    white-space:pre-line;
}

.search{
    background:#fff;
    border:1px solid #dce2eb;
    border-radius:17px;
    padding:5px;
    display:flex;
    align-items:center;
    box-shadow:0 8px 28px rgba(23,32,51,.07)
}

.icon{
    padding:0 12px;
    color:#8a93a3;
    font-size:22px
}

.clear-btn{
    display:none;
    width:36px;
    height:36px;
    margin:0 6px 0 0;
    padding:0;
    border:0;
    border-radius:50%;
    background:#eef1f5;
    color:#697386;
    font-size:22px;
    font-weight:500;
    line-height:36px;
    cursor:pointer;
    flex-shrink:0;
    appearance:none
}

.clear-btn.visible{
    display:block
}

input{
    flex:1;
    border:0;
    outline:0;
    font-size:16px !important;
    padding:14px 6px;
    -webkit-text-size-adjust:100%;
    background:transparent
}

input[type="search"]::-webkit-search-cancel-button{
    -webkit-appearance:none;
    appearance:none;
    display:none;
}

.label{
    margin-top:28px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:800;
    color:#7b8493;
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:center
}

.message,.results{
    background:white;
    border:1px solid #e0e5ed;
    border-radius:17px
}

.message {
    text-align:center;
    padding:22px;
    color:#8992a1
}

.row{
    padding:18px 12px 18px 10px;
    border-bottom:1px solid #edf0f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px
}

.row:last-child{
    border-bottom:0
}

.left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0
}

.name{
    font-size:17px;
    font-weight:700;
    word-break:break-word
}

.price{
    font-size:23px;
    font-weight:800;
}

.price.cheap{
    color:#16a34a
}

.price.normal{
    color:#d97706
}

.price.expensive{
    color:#dc2626
}

.price.ultra-expensive{
    color:#8C0000
}

.georgia-indicator{
    display:block;
    font-size:11px;
    font-weight:700;
    color:#697386;
    margin-bottom:3px;
    white-space: nowrap;
}

.auction-logo{
    width:34px;
    height:24px;
    object-fit:contain;
    display:block;
    flex-shrink:0
}

.auction-name{
    font-size:11px;
    color:#8992a1;
    margin-top:3px
}

@media(max-width:520px){
    .wrap{
        padding:45px 16px
    }

    h1{
        font-size:30px
    }

    .price{
        font-size:21px
    }

    .name{
        font-size:15px
    }
}
</style>
</head>

<body>

<div id="transportation-app">

<div class="wrap">

<h1 id="pageTitle">Transportation Price</h1>

<div class="sub">
<span id="pageSubtitle">Search a branch to find its transportation price.</span>
</div>

<div class="search">
    <div class="icon">🔍</div>
    <input
        id="searchInput"
        type="search"
        placeholder="Search location..."
        autocomplete="off"
        enterkeyhint="search"
    >
    <button
        id="clearSearch"
        class="clear-btn"
        type="button"
        aria-label="Clear search"
    >×</button>
</div>

<div class="label" id="resultLabel">Result</div>

<div id="result" class="message">
    <span id="initialResultText">Search result will appear here.</span>
</div>

</div>

<script>

const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const result = document.getElementById("result");

const TRANSPORTATION_SEARCH_URL =
    "https://yusznijfwkdcvrrqqapz.supabase.co/functions/v1/transportation-search";

const selectedLanguage =
    localStorage.getItem("pulseAutoImportLanguage") || "en";

const translations = {
    en: {
        title: "Transportation Price",
        subtitle: "Search a branch to find its transportation price.",
        placeholder: "Search location...",
        clearSearch: "Clear search",
        result: "Result",
        initialResult: "Search result will appear here.",
        noLocation: "No location found.",
        error: "Unable to load results."
    },

    hy: {
        title: "Փոխադրման արժեք",
        subtitle: "Փնտրեք մասնաճյուղը\nփոխադրման արժեքը գտնելու համար",
        placeholder: "Փնտրել մասնաճյուղ...",
        clearSearch: "Մաքրել որոնումը",
        result: "Արդյունք",
        initialResult: "Որոնման արդյունքը կհայտնվի այստեղ",
        noLocation: "Մասնաճյուղ չի գտնվել",
        error: "Արդյունքները բեռնել չհաջողվեց"
    },

    ru: {
        title: "Стоимость транспортировки",
        subtitle: "Найдите филиал, чтобы узнать стоимость транспортировки.",
        placeholder: "Поиск филиала...",
        clearSearch: "Очистить поиск",
        result: "Результат",
        initialResult: "Результат поиска появится здесь.",
        noLocation: "Филиал не найдено.",
        error: "Не удалось загрузить результаты."
    }
};

const t = translations[selectedLanguage] || translations.en;

document.documentElement.lang = selectedLanguage;
document.title = t.title;

document.getElementById("pageTitle").textContent = t.title;
document.getElementById("pageSubtitle").textContent = t.subtitle;
searchInput.placeholder = t.placeholder;
clearSearch.setAttribute("aria-label", t.clearSearch);
document.getElementById("resultLabel").textContent = t.result;
document.getElementById("initialResultText").textContent = t.initialResult;

function getPriceNumber(price){
    const number = parseInt(price.replace(/[$,+]/g,""),10);
    return Number.isNaN(number) ? 0 : number;
}

function getPriceClass(price){
    const value = getPriceNumber(price);

    if(value > 2800) return "ultra-expensive";
    if(value <= 1915) return "cheap";
    if(value <= 2090) return "normal";

    return "expensive";
}

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function isCanadianLocation(item){
    return ["AB","NB","NS","ON","QC"].includes(item.state);
}

function getAuctionLogo(auction){
    return auction === "IAAI"
        ? "iaai-logo.PNG"
        : "copart-logo.PNG";
}

let searchRequestId = 0;

async function doSearch(){
    const requestId = ++searchRequestId;
    const query = searchInput.value.trim().toLowerCase();

    if(!query){
        result.className = "message";
        result.textContent = t.initialResult;
        return;
    }

    const deviceId =
        localStorage.getItem("pulseAutoImportDeviceId") || "";

    if(!deviceId){
        result.className = "message";
        result.textContent = t.error;
        return;
    }

    try{
        const response = await fetch(TRANSPORTATION_SEARCH_URL,{
            method:"POST",
         headers:{
                "Content-Type":"application/json",
                "apikey":"sb_publishable_hPQ-h9wv8YtlJggfurEbmA_owlsTsY8"
            },
            body:JSON.stringify({
                device_id:deviceId,
                query
            })
        });

        const data = await response.json();

        if(requestId !== searchRequestId){
            return;
        }

        if(!response.ok){
            throw new Error(data?.error || "Search failed");
        }

        const found = Array.isArray(data.results)
            ? data.results
            : [];

        if(found.length === 0){
            result.className = "message";
            result.textContent = t.noLocation;
            return;
        }

        result.className = "results";

        result.innerHTML = found.map(item => `
            <div class="row">
                <div class="left">
                    <img
                        class="auction-logo"
                        src="./${getAuctionLogo(item.auction)}"
                        alt="${escapeHTML(item.auction)}"
                    >
                    <div>
                        <div class="name">
                            ${escapeHTML(item.state)}-${escapeHTML(item.branch)}
                        </div>
                        <div class="auction-name">
                            ${escapeHTML(item.auction)}
                        </div>
                    </div>
                </div>

                <div class="price ${getPriceClass(item.price)}">
                    ${isCanadianLocation(item) ? '<span class="georgia-indicator">🇬🇪 To Georgia</span>' : ''}
                    ${escapeHTML(item.price)}
                </div>
            </div>
        `).join("");
    }catch(error){
        if(requestId !== searchRequestId){
            return;
        }

        console.error("Transportation search error:", error);

        result.className = "message";
        result.textContent = t.error;
    }
}

function updateClearButton(){
    clearSearch.classList.toggle(
        "visible",
        searchInput.value.trim().length > 0
    );
}

searchInput.addEventListener("input",function(){
    doSearch();
    updateClearButton();
});

clearSearch.addEventListener("click",function(){
    searchInput.value = "";
    searchRequestId++;
    result.className = "message";
    result.textContent = t.initialResult;
    updateClearButton();
    searchInput.focus();
});

updateClearButton();
</script>
</div>
</body>
</html>
