<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<title>PulseAutoImport</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7fa;
    color:#172033;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
    max-width:700px;
    margin:auto;
    padding:55px 18px
}

.brand{
    text-align:center;
    font-size:13px;
    font-weight:800;
    letter-spacing:.14em;
    color:#697386
}

h1{
    text-align:center;
    font-size:34px;
    margin:10px 0 8px;
}

.sub{
    text-align:center;
    color:#7d8695;
    margin-bottom:28px
}

.search{
    background:#fff;
    border:1px solid #dce2eb;
    border-radius:17px;
    padding:5px;
    display:flex;
    align-items:center;
    box-shadow:0 8px 28px rgba(23,32,51,.07)
}

.icon{
    padding:0 12px;
    color:#8a93a3;
    font-size:22px
}

.clear-btn{
    display:none;
    width:36px;
    height:36px;
    margin:0 6px 0 0;
    padding:0;
    border:0;
    border-radius:50%;
    background:#eef1f5;
    color:#697386;
    font-size:22px;
    font-weight:500;
    line-height:36px;
    cursor:pointer;
    flex-shrink:0;
    appearance:none
}

.clear-btn.visible{
    display:block
}

input{
    flex:1;
    border:0;
    outline:0;
    font-size:16px !important;
    padding:14px 6px;
    -webkit-text-size-adjust:100%;
    background:transparent
}

button{
    width:100%;
    margin-top:12px;
    border:0;
    border-radius:15px;
    padding:17px;
    background:#172033;
    color:white;
    font-size:17px;
    font-weight:750
}

.label{
    margin-top:28px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:800;
    color:#7b8493;
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:center
}

.message,.results{
    background:white;
    border:1px solid #e0e5ed;
    border-radius:17px
}

.message{
    text-align:center;
    padding:22px;
    color:#8992a1
}

.row{
    padding:18px 12px 18px 10px;
    border-bottom:1px solid #edf0f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px
}

.row:last-child{
    border-bottom:0
}

.left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0
}

.name{
    font-size:17px;
    font-weight:700;
    word-break:break-word
}

.desc{
    font-size:12px;
    color:#9299a6;
    margin-top:4px
}

.price{
    font-size:23px;
    font-weight:800;
}

.price.cheap{
    color:#16a34a
}

.price.normal{
    color:#d97706
}

.price.expensive{
    color:#dc2626
}

.price.ultra-expensive{
    color:#8C0000
}

.georgia-indicator{
    display:block;
    font-size:11px;
    font-weight:700;
    color:#697386;
    margin-bottom:3px;
    white-space: nowrap;
}

.auction-logo{
    width:34px;
    height:24px;
    object-fit:contain;
    display:block;
    flex-shrink:0
}

.auction-name{
    font-size:11px;
    color:#8992a1;
    margin-top:3px
}

@media(max-width:520px){
    .wrap{
        padding:45px 16px
    }

    h1{
        font-size:30px
    }

    .price{
        font-size:21px
    }

    .name{
        font-size:15px
    }
}
</style>
</head>

<body>

<div id="transportation-app">

<div class="wrap">

<h1>Transportation Price</h1>

<div class="sub">
Search a branch to find its transportation price.
</div>

<div class="search">
    <div class="icon">🔍</div>
    <input
        id="searchInput"
        type="search"
        placeholder="Search location..."
        autocomplete="off"
        enterkeyhint="search"
    >
    <button
        id="clearSearch"
        class="clear-btn"
        type="button"
        aria-label="Clear search"
    >×</button>
</div>

<div class="label">Result</div>

<div id="result" class="message">
    Search result will appear here.
</div>

</div>

/* =========================
   COMBINED DATABASE
========================= */

const database = [
    ...iaaiDatabase,
    ...copartDatabase
];

const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const result = document.getElementById("result");

function getPriceNumber(price){
    const number = parseInt(price.replace(/[$,+]/g,""),10);
    return Number.isNaN(number) ? 0 : number;
}

function getPriceClass(price){
    const value = getPriceNumber(price);

    if(value > 2800) return "ultra-expensive";
    if(value <= 1915) return "cheap";
    if(value <= 2090) return "normal";

    return "expensive";
}

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function isCanadianLocation(item){
    return ["AB","NB","NS","ON","QC"].includes(item.state);
}

function doSearch(){

    const query = searchInput.value.trim().toLowerCase();

    if(!query){
        result.className = "message";
        result.textContent = "Search result will appear here.";
        return;
    }

  const found = database.filter(item => {
    const state = item.state.toLowerCase();
    const name = item.name.toLowerCase();
    const auction = item.auction.toLowerCase();

    return (
        state.startsWith(query) ||
        name.startsWith(query) ||
        auction.startsWith(query)
    );
});

    if(found.length === 0){
        result.className = "message";
        result.textContent = "No location found.";
        return;
    }

    result.className = "results";

    result.innerHTML = found.map(item => `
        <div class="row">

            <div class="left">

                <img
                    class="auction-logo"
src="./${item.logo}"
                    alt="${escapeHTML(item.auction)}"
                >

                <div>
                    <div class="name">
                        ${escapeHTML(item.state)}-${escapeHTML(item.name)}
                    </div>

                    <div class="auction-name">
                        ${escapeHTML(item.auction)}
                    </div>
                </div>

            </div>

            <div class="price ${getPriceClass(item.price)}">
                ${isCanadianLocation(item) ? '<span class="georgia-indicator">🇬🇪 To Georgia</span>' : ''}
                ${escapeHTML(item.price)}
            </div>

        </div>
    `).join("");
}

function updateClearButton(){
    clearSearch.classList.toggle(
        "visible",
        searchInput.value.trim().length > 0
    );
}

searchInput.addEventListener("input",function(){
    doSearch();
    updateClearButton();
});

clearSearch.addEventListener("click",function(){
    searchInput.value = "";
    result.className = "message";
    result.textContent = "Search result will appear here.";
    updateClearButton();
    searchInput.focus();
});

updateClearButton();

searchInput.addEventListener("keydown",function(event){
    if(event.key === "Enter"){
        event.preventDefault();
        doSearch();
    }
});

</script>
