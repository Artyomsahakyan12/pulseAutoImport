     .user-button {
    position: absolute;
    top: 35px;
    left: 20px;
    width: 48px;
    height: 48px;
    box-sizing: border-box;
    border: 1px solid #d9e0e9;
    border-radius: 50%;
    background: #ffffff;
    color: #172033;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    text-decoration: none;
    box-shadow:
        0 2px 4px rgba(35, 55, 85, 0.08),
        0 5px 12px rgba(35, 55, 85, 0.08);
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
}

.user-button:active {
    transform: scale(0.96);
}

.user-icon {
    width: 25px;
    height: 25px;
    fill: none;
    stroke: #ef4444;
    stroke-width: 2;
    stroke-linecap: round;
}

.user-button.access-granted .user-icon {
    stroke: #22c55e;
}

.user-button.access-denied .user-icon {

}

.language-selector {
    position: absolute;
    top: 35px;
    right: 20px;
    z-index: 100;
}

.language-button {
    width: 48px;
    height: 48px;
    padding: 0;
    border: 1px solid #d9e0e9;
    border-radius: 50%;
    background: #ffffff;
    color: #172033;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
    line-height: 1;
    cursor: pointer;

    box-shadow:
        0 2px 4px rgba(35, 55, 85, 0.08),
        0 5px 12px rgba(35, 55, 85, 0.08);

    -webkit-tap-highlight-color: transparent;
}

.language-button:focus {
    outline: none;
}

.language-menu {
    position: absolute;
    top: 0;
    right: 56px;

    display: none;
    flex-direction: row;
    align-items: center;
    gap: 6px;

    height: 48px;
    padding: 3px 7px;

    border-radius: 24px;
    background: #ffffff;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18);

    z-index: 1000;
}

.language-menu.show {
    display: flex;
}

.language-menu button {
    width: 42px;
    height: 42px;

    padding: 0;
    border: none;
    border-radius: 50%;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    line-height: 1;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.language-menu button:active {
    background: rgba(40, 100, 232, 0.12);
}
        
    </style>

    <script>

        const translations = {
            en: {
    transportation: "Transportation",
    price: "price",
    proformaLine1: "Proforma",
    proformaLine2: "invoice",
    bidcars: "BidCars",
    container: "Container",
    tracking: "tracking"
},

hy: {
    transportation: "Փոխադրման",
    price: "արժեք",
    proformaLine1: "Հաշիվ",
    proformaLine2: "ապրանքագիր",
    bidcars: "ԲիդՔարս",
    container: "Կոնտեյների",
    tracking: "հետևում"
},

ru: {
    transportation: "Стоимость",
    price: "транспортировки",
    proformaLine1: "Счёт",
    proformaLine2: "проформа",
    bidcars: "БидКарс",
    container: "Отслеживание",
    tracking: "контейнера"
}
        };


       const translationElements = {
    transportation: "transportationText",
    price: "priceText",
    proformaLine1: "proformaTextLine1",
    proformaLine2: "proformaTextLine2",
    bidcars: "bidcarsText",
    container: "containerText",
    tracking: "trackingText"
};

const languageButton =
    document.getElementById("languageButton");

const languageMenu =
    document.getElementById("languageMenu");

const languageFlags = {
    en: "🇬🇧",
    hy: "🇦🇲",
    ru: "🇷🇺"
};

function applyLanguage(language) {

    const selectedLanguage =
        translations[language] || translations.en;

    Object.entries(translationElements).forEach(
        ([key, elementId]) => {

            document.getElementById(elementId).textContent =
                selectedLanguage[key];

        }
    );

    document.documentElement.lang = language;

    localStorage.setItem(
        "pulseAutoImportLanguage",
        language
    );

    languageButton.textContent =
        languageFlags[language] || languageFlags.en;
}

const savedLanguage =
    localStorage.getItem("pulseAutoImportLanguage") || "en";

applyLanguage(savedLanguage);

languageButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        languageMenu.classList.toggle("show");

    }
);

languageMenu.addEventListener(
    "click",
    function (event) {

        const button =
            event.target.closest("[data-language]");

        if (!button) return;

        const language =
            button.dataset.language;

        applyLanguage(language);

        languageMenu.classList.remove("show");

    }
);

document.addEventListener(
    "click",
    function (event) {

        if (
            !event.target.closest(".language-selector")
        ) {
            languageMenu.classList.remove("show");
        }

    }
);
        
        const FUNCTION_URL =
    "https://yusznijfwkdcvrrqqapz.supabase.co/functions/v1/telegram-access";

const STORAGE_KEY =
    "pulseAutoImportDeviceId";

const transportButton =
    document.getElementById("transportButton");

const proformaButton =
    document.getElementById("proformaButton");

const caucasusManagementButton =
document.getElementById("caucasusManagementButton");

const userButton =
    document.getElementById("userButton");

function hideProtectedButtons() {
  transportButton.style.display = "none";
  proformaButton.style.display = "none";
  caucasusManagementButton.style.display = "none";

  userButton.classList.remove("access-granted");
  userButton.classList.add("access-denied");
}


async function checkAccess() {

    hideProtectedButtons();

    const deviceId =
        localStorage.getItem(STORAGE_KEY);

    if (!deviceId) {
        return;
    }

    try {

        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "check",
                device_id: deviceId
            })
        });

        const data = await response.json();

       if (
    response.ok &&
    data.status === "approved"
) {
    transportButton.style.display = "flex";
proformaButton.style.display = "flex";
caucasusManagementButton.style.display = "flex";

    userButton.classList.remove("access-denied");
    userButton.classList.add("access-granted");
}

    } catch (error) {

        console.error(
            "Access check error:",
            error
        );

    }
}


checkAccess();

    </script>
