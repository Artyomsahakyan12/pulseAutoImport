     .user-button {

}

.language-menu.show {

.language-menu button {

}

/* Pulse AutoImport Loading Animation */
#entry-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
background: #f5f6fa;
}

#entry-loader.is-hidden {
    display: none;
}

#entry-loader .loading-logo {
    display: block;
    width: min(86vw, 420px);
    height: auto;
    object-fit: contain;
    clip-path: inset(0 100% 0 0);
    animation: logoReveal 0.45s linear forwards;
    transform-origin: center center;
    will-change: transform;
}

#entry-loader.is-transitioning {
    background-color: transparent;
}

@keyframes logoReveal {
    to {
        clip-path: inset(0 0 0 0);
    }
}

    <script>

        const translations = {
            en: {
    transportation: "Transportation",
    price: "price",
    proformaLine1: "Proforma",
    proformaLine2: "invoice",
    bidcars: "BidCars",
    container: "Container",
    tracking: "tracking",
     caucasus: "Caucasus",
management: "management"
},

hy: {
    transportation: "Փոխադրման",
    price: "արժեք",
    proformaLine1: "Հաշիվ",
    proformaLine2: "ապրանքագիր",
    bidcars: "ԲիդՔարս",
    container: "Կոնտեյների",
    tracking: "հետևում",
    caucasus: "Caucasus",
management: "կառավարում"
},

ru: {
    transportation: "Стоимость",
    price: "транспортировки",
    proformaLine1: "Счёт",
    proformaLine2: "проформа",
    bidcars: "БидКарс",
    container: "Отслеживание",
    tracking: "контейнера",
    caucasus: "Caucasus",
    management: "управление"
}
        };


       const translationElements = {
    transportation: "transportationText",
    price: "priceText",
    proformaLine1: "proformaTextLine1",
    proformaLine2: "proformaTextLine2",
    bidcars: "bidcarsText",
    container: "containerText",
    tracking: "trackingText",
   caucasus: "caucasusText",
management: "managementText"
};

const languageButton =
    document.getElementById("languageButton");

const languageMenu =
    document.getElementById("languageMenu");

const languageFlags = {
    en: "🇬🇧",
    hy: "🇦🇲",
    ru: "🇷🇺"
};

function applyLanguage(language) {

    const selectedLanguage =
        translations[language] || translations.en;

    Object.entries(translationElements).forEach(
        ([key, elementId]) => {

            document.getElementById(elementId).textContent =
                selectedLanguage[key];

        }
    );

    document.documentElement.lang = language;

    localStorage.setItem(
        "pulseAutoImportLanguage",
        language
    );

    languageButton.textContent =
        languageFlags[language] || languageFlags.en;
}

const savedLanguage =
    localStorage.getItem("pulseAutoImportLanguage") || "en";

applyLanguage(savedLanguage);

languageButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        languageMenu.classList.toggle("show");

    }
);

languageMenu.addEventListener(
    "click",
    function (event) {

        const button =
            event.target.closest("[data-language]");

        if (!button) return;

        const language =
            button.dataset.language;

        applyLanguage(language);

        languageMenu.classList.remove("show");

    }
);

document.addEventListener(
    "click",
    function (event) {

        if (
            !event.target.closest(".language-selector")
        ) {
            languageMenu.classList.remove("show");
        }

    }
);
        
        const FUNCTION_URL =
    "https://yusznijfwkdcvrrqqapz.supabase.co/functions/v1/telegram-access";

const STORAGE_KEY =
    "pulseAutoImportDeviceId";

const transportButton =
    document.getElementById("transportButton");

const proformaButton =
    document.getElementById("proformaButton");

const caucasusManagementButton =
document.getElementById("caucasusManagementButton");

const userButton =
    document.getElementById("userButton");

function hideProtectedButtons() {
  transportButton.style.display = "none";
  proformaButton.style.display = "none";
  caucasusManagementButton.style.display = "none";

  userButton.classList.remove("access-granted");
  userButton.classList.add("access-denied");
}

async function checkAccess() {
    const loadingScreen = document.getElementById("entry-loader");
    const loadingStartedAt = Date.now();

    hideProtectedButtons();

    try {
        const deviceId = localStorage.getItem(STORAGE_KEY);

        if (deviceId) {
            const response = await fetch(FUNCTION_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=UTF-8"
                },
                body: JSON.stringify({
                    action: "check",
                    device_id: deviceId
                })
            });

            const data = await response.json();

            if (response.ok && data.status === "approved") {
                const protectedButtons = [
                    transportButton,
                    proformaButton,
                    caucasusManagementButton
                ];

                protectedButtons.forEach(button => {
                    button.style.display = "flex";
                });

                userButton.classList.remove("access-denied");
                userButton.classList.add("access-granted");
            }
        }
    } catch (error) {
        console.error("Access check error:", error);
    } finally {
        const remaining = Math.max(
            0,
            550 - (Date.now() - loadingStartedAt)
        );

        if (remaining > 0) {
            await new Promise(resolve => setTimeout(resolve, remaining));
        }


const loadingLogo = loadingScreen.querySelector(".loading-logo");
const logoPlaceholder = document.getElementById("logoPlaceholder");

if (loadingLogo && logoPlaceholder) {
    if (!loadingLogo.complete) {
        await new Promise(resolve => {
            loadingLogo.addEventListener("load", resolve, { once: true });
            loadingLogo.addEventListener("error", resolve, { once: true });
        });
    }

    const start = loadingLogo.getBoundingClientRect();
    const target = logoPlaceholder.getBoundingClientRect();

    if (start.width > 0 && target.width > 0 && loadingLogo.naturalWidth > 0) {
        loadingLogo.style.animation = "none";
        loadingLogo.style.clipPath = "inset(0)";
        loadingLogo.style.transition = "none";
        loadingLogo.style.transform = "none";

        void loadingLogo.offsetWidth;

        const dx =
            target.left + target.width / 2 -
            (start.left + start.width / 2);

        const dy =
            target.top + target.height / 2 -
            (start.top + start.height / 2);

        const scale = target.width / start.width;

        
loadingLogo.style.transition =
    "transform 500ms cubic-bezier(.10,.8,.10,1)";

await new Promise(resolve => {
    requestAnimationFrame(() => {
        // Logo movement and background fade start together.
        loadingScreen.classList.add("is-transitioning");

        loadingLogo.style.transform =
            `translate(${dx}px, ${dy}px) scale(${scale})`;

        setTimeout(resolve, 500);
    });
});


        // Keep the same image; move it into its final position.
        loadingLogo.classList.remove("loading-logo");
        loadingLogo.classList.add("brand-logo");

        loadingLogo.style.animation = "none";
        loadingLogo.style.clipPath = "none";
        loadingLogo.style.transition = "none";
        loadingLogo.style.transform = "none";
        loadingLogo.style.width = "100%";
        loadingLogo.style.maxWidth = "none";
        loadingLogo.style.height = "auto";
        loadingLogo.style.objectFit = "contain";
        loadingLogo.style.display = "block";
        loadingLogo.style.margin = "0";

        logoPlaceholder.appendChild(loadingLogo);
        logoPlaceholder.removeAttribute("aria-hidden");
    }
}

loadingScreen.classList.add("is-hidden");

    }
}

checkAccess();

    </script>
